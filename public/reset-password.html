<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nueva contraseña | Mordisco OS</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#151412;font-family:Arial,sans-serif;padding:20px}
    .card{width:min(440px,100%);background:#fff;border-radius:24px;padding:34px;box-shadow:0 25px 70px rgba(0,0,0,.35)}
    img{width:90px;display:block;margin:auto} h1{text-align:center;font-size:27px} p{text-align:center;color:#555;line-height:1.5}
    input,button{width:100%;padding:14px;border-radius:11px;font-size:15px} input{border:1px solid #ddcfbb;margin:7px 0}
    button{border:0;background:#ffc400;font-weight:900;margin-top:10px;cursor:pointer} #msg{margin-top:12px;padding:11px;border-radius:10px;text-align:center;font-weight:700;display:none}
  </style>
</head>
<body>
  <main class="card">
    <img src="/mordisco-logo.png" alt="Mordisco">
    <h1>Crea una contraseña nueva</h1>
    <p>Escribe una contraseña de al menos 8 caracteres.</p>
    <form id="resetForm">
      <input id="password" type="password" minlength="8" placeholder="Contraseña nueva" required>
      <input id="confirm" type="password" minlength="8" placeholder="Repite la contraseña" required>
      <button>Guardar contraseña</button>
    </form>
    <div id="msg"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const client = supabase.createClient('https://nmmjthqflxwucpmmmrks.supabase.co','sb_publishable_izCztp4wZ0MzKOHjT2KGYA_ot_3pgb0');
    const msg = document.querySelector('#msg');
    const show=(text,ok=false)=>{msg.style.display='block';msg.style.background=ok?'#dff7e7':'#ffe0dc';msg.style.color=ok?'#11652d':'#8d1e16';msg.textContent=text};
    document.querySelector('#resetForm').addEventListener('submit',async e=>{
      e.preventDefault();
      const password=document.querySelector('#password').value;
      const confirm=document.querySelector('#confirm').value;
      if(password!==confirm)return show('Las contraseñas no coinciden.');
      const {error}=await client.auth.updateUser({password});
      if(error)return show(error.message);
      show('Contraseña actualizada. Abriendo el administrador…',true);
      setTimeout(()=>location.href='/admin',1400);
    });
  </script>
</body>
</html>

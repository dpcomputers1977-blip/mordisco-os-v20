<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#151412">
  <title>Nueva contraseña | Mordisco OS</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      background:
        radial-gradient(circle at 20% 10%,rgba(255,196,0,.09),transparent 32%),
        #151412;
      font-family:Arial,sans-serif;padding:20px;color:#171717
    }
    .card{
      width:min(460px,100%);background:#fff;border-radius:26px;
      padding:34px 30px;box-shadow:0 30px 80px rgba(0,0,0,.42)
    }
    .logo{width:92px;height:70px;object-fit:contain;display:block;margin:0 auto 4px}
    .eyebrow{display:block;text-align:center;color:#e8a900;font-weight:900;letter-spacing:1.7px;font-size:13px}
    h1{font-size:29px;text-align:center;margin:16px 0 10px}
    .intro{text-align:center;color:#555;line-height:1.5;margin:0 0 22px}
    label{display:block;font-size:12px;font-weight:800;margin:12px 0 6px}
    input{width:100%;padding:14px;border:1px solid #dfd0ba;border-radius:11px;font-size:15px;outline:none}
    input:focus{border-color:#ffc400;box-shadow:0 0 0 3px rgba(255,196,0,.15)}
    button{width:100%;border:0;border-radius:11px;padding:14px;font-size:14px;font-weight:900;cursor:pointer}
    .primary{background:#ffc400;color:#111;margin-top:14px}
    .secondary{background:#fff;border:1px solid #dfcda9;color:#4a3917;margin-top:9px}
    button:disabled{opacity:.6;cursor:not-allowed}
    #msg{display:block;margin-top:13px;padding:12px;border-radius:10px;text-align:center;font-size:13px;font-weight:700;line-height:1.45;background:#fff4c7;color:#654d00}
    .hidden{display:none!important}
    .home{display:block;text-align:center;margin-top:18px;color:#6a5a3a;font-size:12px;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/mordisco-logo.png" alt="Mordisco">
    <span class="eyebrow">MORDISCO OS</span>
    <h1>Crea una contraseña nueva</h1>
    <p class="intro">Abre esta página desde el correo de recuperación y define una contraseña de al menos 8 caracteres.</p>

    <form id="resetForm" class="hidden">
      <label for="password">Nueva contraseña</label>
      <input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required>

      <label for="confirm">Confirmar contraseña</label>
      <input id="confirm" type="password" minlength="8" autocomplete="new-password" placeholder="Repite la contraseña" required>

      <button id="saveButton" class="primary" type="submit">Guardar contraseña</button>
    </form>

    <div id="msg" role="status">Validando el enlace de recuperación…</div>
    <button id="requestAgain" class="secondary hidden" type="button">Solicitar un enlace nuevo</button>
    <a class="home" href="/acceso-admin">← Volver al acceso administrativo</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (() => {
      'use strict';

      const SUPABASE_URL = 'https://nmmjthqflxwucpmmmrks.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_izCztp4wZ0MzKOHjT2KGYA_ot_3pgb0';
      const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: {
          detectSessionInUrl: true,
          persistSession: true,
          autoRefreshToken: true,
          flowType: 'pkce'
        }
      });

      const form = document.querySelector('#resetForm');
      const msg = document.querySelector('#msg');
      const requestAgain = document.querySelector('#requestAgain');
      const saveButton = document.querySelector('#saveButton');

      function show(text, type = 'info') {
        const colors = {
          info: ['#fff4c7','#654d00'],
          error: ['#ffe1dd','#8b1f17'],
          success: ['#def7e7','#11652d']
        };
        const [background,color] = colors[type] || colors.info;
        msg.style.background = background;
        msg.style.color = color;
        msg.textContent = text;
      }

      function showExpired() {
        form.classList.add('hidden');
        requestAgain.classList.remove('hidden');
        show('El enlace no es válido o ya venció. Solicita uno nuevo desde el acceso administrativo.', 'error');
      }

      async function establishRecoverySession() {
        try {
          const url = new URL(window.location.href);
          const code = url.searchParams.get('code');

          if (code) {
            const { error } = await client.auth.exchangeCodeForSession(code);
            if (error && !/code verifier/i.test(error.message || '')) throw error;
          }

          const { data, error } = await client.auth.getSession();
          if (error) throw error;

          if (data?.session?.user) {
            form.classList.remove('hidden');
            requestAgain.classList.add('hidden');
            show('Enlace verificado. Ahora escribe tu contraseña nueva.', 'success');

            // Remove recovery tokens/code from the visible URL.
            history.replaceState({}, document.title, '/reset-password');
            return;
          }

          // Older implicit-flow links may need a brief moment to be processed.
          await new Promise(resolve => setTimeout(resolve, 900));
          const retry = await client.auth.getSession();

          if (retry.data?.session?.user) {
            form.classList.remove('hidden');
            show('Enlace verificado. Ahora escribe tu contraseña nueva.', 'success');
            history.replaceState({}, document.title, '/reset-password');
            return;
          }

          showExpired();
        } catch (error) {
          console.error('Recuperación:', error);
          showExpired();
        }
      }

      client.auth.onAuthStateChange((event, session) => {
        if ((event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') && session?.user) {
          form.classList.remove('hidden');
          requestAgain.classList.add('hidden');
          show('Enlace verificado. Ahora escribe tu contraseña nueva.', 'success');
        }
      });

      form.addEventListener('submit', async event => {
        event.preventDefault();

        const password = document.querySelector('#password').value;
        const confirm = document.querySelector('#confirm').value;

        if (password.length < 8) return show('La contraseña debe tener al menos 8 caracteres.', 'error');
        if (password !== confirm) return show('Las contraseñas no coinciden.', 'error');

        saveButton.disabled = true;
        saveButton.textContent = 'Guardando…';
        show('Actualizando la contraseña…');

        const { error } = await client.auth.updateUser({ password });

        if (error) {
          saveButton.disabled = false;
          saveButton.textContent = 'Guardar contraseña';
          return show(error.message || 'No se pudo actualizar la contraseña.', 'error');
        }

        show('Contraseña actualizada correctamente. Abriendo el administrador…', 'success');
        sessionStorage.setItem('mordisco_admin_verified', '1');
        setTimeout(() => window.location.replace('/admin?session=ok'), 1300);
      });

      requestAgain.addEventListener('click', () => {
        window.location.href = '/acceso-admin';
      });

      establishRecoverySession();
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#151412">
  <title>Acceso de administrador | Mordisco OS</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:
      radial-gradient(circle at 20% 10%,rgba(255,196,0,.08),transparent 30%),#151412;
      font-family:Arial,sans-serif;padding:20px;color:#171717}
    .card{width:min(460px,100%);background:#fff;border-radius:26px;padding:34px 30px;box-shadow:0 30px 80px rgba(0,0,0,.42)}
    .logo{width:92px;height:70px;object-fit:contain;display:block;margin:0 auto 4px}
    .eyebrow{display:block;text-align:center;color:#e8a900;font-weight:900;letter-spacing:1.7px;font-size:13px}
    h1{font-size:29px;text-align:center;margin:16px 0 10px}
    .intro{text-align:center;color:#555;line-height:1.5;margin:0 0 22px}
    label{display:block;font-size:12px;font-weight:800;margin:12px 0 6px}
    input{width:100%;padding:14px;border:1px solid #dfd0ba;border-radius:11px;font-size:15px;outline:none}
    input:focus{border-color:#ffc400;box-shadow:0 0 0 3px rgba(255,196,0,.15)}
    button{width:100%;border-radius:11px;padding:13px 14px;font-size:14px;font-weight:900;cursor:pointer}
    .primary{border:0;background:#ffc400;color:#111;margin-top:12px}
    .secondary{border:1px solid #dfcda9;background:#fff;color:#4a3917;margin-top:8px}
    .home{display:block;text-align:center;margin-top:18px;color:#6a5a3a;font-size:12px;font-weight:700}
    #message{display:none;margin-top:12px;padding:12px;border-radius:10px;font-size:13px;font-weight:700;line-height:1.45}
    .note{margin-top:15px;padding:12px;border-radius:10px;background:#fff7da;color:#665000;font-size:12px;line-height:1.45}
  
    button:disabled{opacity:.55;cursor:not-allowed}
    .message.info{background:#eef5ff;color:#194f8a}
    
    .recovery-link{
      width:auto!important;
      display:block;
      margin:14px auto 0;
      padding:4px 0!important;
      border:0!important;
      background:transparent!important;
      color:#735a22!important;
      text-decoration:underline;
      font-size:12px!important;
      box-shadow:none!important
    }
    .secondary-button{
      margin-top:8px;
      background:#fff!important;
      border:1px solid #d8c4a0!important
    }
    .small-help{
      font-size:12px;
      line-height:1.45;
      color:#6e6049;
      text-align:center;
      margin:10px 0 0
    }
    </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/mordisco-logo.png" alt="Mordisco">
    <span class="eyebrow">MORDISCO OS</span>
    <h1>Acceso de administrador</h1>
    <p class="intro">Ingresa con tu correo administrativo y contraseña.</p>

    <form id="loginForm">
      <label for="email">Correo</label>
      <input id="email" type="email" value="dpcomputers1977+admin@gmail.com" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Tu contraseña">
      <button class="primary" type="submit">Ingresar con contraseña</button>
    </form>

    <button class="secondary" id="magicButton" type="button">Enviar enlace de acceso a Gmail</button>
    <button class="secondary" id="resetButton" type="button">Crear una contraseña nueva</button>

    <div id="message" role="status"></div>
    <div class="note">El enlace puede tardar unos segundos. Revisa también la carpeta Spam o Correo no deseado.</div>
    <a class="home" href="/">← Volver a la página principal</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (() => {
      'use strict';

      const SUPABASE_URL='https://nmmjthqflxwucpmmmrks.supabase.co';
      const SUPABASE_KEY='sb_publishable_izCztp4wZ0MzKOHjT2KGYA_ot_3pgb0';

      const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
        auth:{
          persistSession:true,
          autoRefreshToken:true,
          detectSessionInUrl:true,
          flowType:'pkce'
        }
      });

      const form=document.querySelector('#loginForm');
      const emailInput=document.querySelector('#email');
      const passwordInput=document.querySelector('#password');
      const submitButton=form?.querySelector('button[type="submit"]');
      const message=document.querySelector('#message');
      const recoveryPanel=document.querySelector('#recoveryPanel');
      const showRecoveryButton=document.querySelector('#showRecoveryButton');
      const requestRecoveryButton=document.querySelector('#requestRecoveryButton');

      function showMessage(text,type='info'){
        if(!message)return;
        message.textContent=text;
        message.className='message';
        message.style.background=type==='error'?'#ffe0dc':type==='success'?'#def7e7':'#fff4c7';
        message.style.color=type==='error'?'#8b1f17':type==='success'?'#11652d':'#654d00';
      }

      function friendlyError(error){
        const text=String(error?.message||error||'').toLowerCase();
        if(text.includes('invalid login credentials')) return 'El correo o la contraseña no coinciden.';
        if(text.includes('email rate limit exceeded')) return 'Supabase bloqueó temporalmente los correos. Ingresa con tu contraseña.';
        if(text.includes('email not confirmed')) return 'El correo todavía no está confirmado.';
        return error?.message||'No se pudo iniciar sesión.';
      }

      async function validateAdminAndEnter(){
        const {data:{user}}=await client.auth.getUser();
        if(!user)return false;

        const {data,error}=await client
          .from('admin_users')
          .select('active')
          .eq('user_id',user.id)
          .eq('active',true)
          .maybeSingle();

        if(error||!data){
          await client.auth.signOut();
          showMessage('Esta cuenta no tiene acceso de administrador activo.','error');
          return false;
        }

        sessionStorage.setItem('mordisco_admin_verified','1');
        window.location.replace('/admin?session=ok');
        return true;
      }

      async function restoreSession(){
        const {data:{session}}=await client.auth.getSession();
        if(session?.user){
          showMessage('Sesión encontrada. Abriendo el administrador…','success');
          await validateAdminAndEnter();
        }
      }

      form?.addEventListener('submit',async event=>{
        event.preventDefault();

        const email=emailInput.value.trim().toLowerCase();
        const password=passwordInput.value;

        if(!email||!password){
          return showMessage('Escribe el correo y la contraseña.','error');
        }

        submitButton.disabled=true;
        submitButton.textContent='Ingresando…';
        showMessage('Validando acceso…');

        const {error}=await client.auth.signInWithPassword({email,password});

        if(error){
          submitButton.disabled=false;
          submitButton.textContent='Ingresar con contraseña';
          return showMessage(friendlyError(error),'error');
        }

        const entered=await validateAdminAndEnter();
        if(!entered){
          submitButton.disabled=false;
          submitButton.textContent='Ingresar con contraseña';
        }
      });

      showRecoveryButton?.addEventListener('click',()=>{
        recoveryPanel?.classList.toggle('hidden');
      });

      requestRecoveryButton?.addEventListener('click',async()=>{
        const email=emailInput.value.trim().toLowerCase();
        if(!email)return showMessage('Escribe primero tu correo administrativo.','error');

        requestRecoveryButton.disabled=true;
        requestRecoveryButton.textContent='Enviando…';

        const {error}=await client.auth.resetPasswordForEmail(email,{
          redirectTo:'https://mordiscofastfood.com/reset-password'
        });

        if(error){
          requestRecoveryButton.disabled=false;
          requestRecoveryButton.textContent='Enviar un correo de recuperación';
          return showMessage(friendlyError(error),'error');
        }

        showMessage('Correo enviado. Usa únicamente el mensaje más reciente.','success');
        setTimeout(()=>{
          requestRecoveryButton.disabled=false;
          requestRecoveryButton.textContent='Enviar un correo de recuperación';
        },60000);
      });

      restoreSession();
    })();
</script>
</body>
</html>

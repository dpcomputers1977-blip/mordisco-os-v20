<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#151412">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Acceso de administrador | Mordisco OS</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:
      radial-gradient(circle at 20% 10%,rgba(255,196,0,.08),transparent 30%),#151412;
      font-family:Arial,sans-serif;padding:20px;color:#171717}
    .card{width:min(460px,100%);background:#fff;border-radius:26px;padding:34px 30px;box-shadow:0 30px 80px rgba(0,0,0,.42)}
    .logo{width:92px;height:70px;object-fit:contain;display:block;margin:0 auto 4px}
    .eyebrow{display:block;text-align:center;color:#e8a900;font-weight:900;letter-spacing:1.7px;font-size:13px}
    h1{font-size:29px;text-align:center;margin:16px 0 10px}
    .intro{text-align:center;color:#555;line-height:1.5;margin:0 0 22px}
    label{display:block;font-size:12px;font-weight:800;margin:12px 0 6px}
    input{width:100%;padding:14px;border:1px solid #dfd0ba;border-radius:11px;font-size:15px;outline:none}
    input:focus{border-color:#ffc400;box-shadow:0 0 0 3px rgba(255,196,0,.15)}
    button{width:100%;border-radius:11px;padding:13px 14px;font-size:14px;font-weight:900;cursor:pointer}
    .primary{border:0;background:#ffc400;color:#111;margin-top:12px}
    .secondary{border:1px solid #dfcda9;background:#fff;color:#4a3917;margin-top:8px}
    .home{display:block;text-align:center;margin-top:18px;color:#6a5a3a;font-size:12px;font-weight:700}
    #message{display:none;margin-top:12px;padding:12px;border-radius:10px;font-size:13px;font-weight:700;line-height:1.45}
    .note{margin-top:15px;padding:12px;border-radius:10px;background:#fff7da;color:#665000;font-size:12px;line-height:1.45}
  
    button:disabled{opacity:.55;cursor:not-allowed}
    .message.info{background:#eef5ff;color:#194f8a}
    
    .recovery-link{
      width:auto!important;
      display:block;
      margin:14px auto 0;
      padding:4px 0!important;
      border:0!important;
      background:transparent!important;
      color:#735a22!important;
      text-decoration:none;
      font-size:12px!important;
      box-shadow:none!important;
      outline:none!important
    }
    .recovery-link:hover{color:#b87900!important;text-decoration:underline}
    .secondary-button{
      margin-top:8px;
      background:#fff!important;
      border:1px solid #d8c4a0!important
    }
    .small-help{
      font-size:12px;
      line-height:1.45;
      color:#6e6049;
      text-align:center;
      margin:10px 0 0
    }
    
    .hidden{display:none!important}
    </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/mordisco-logo.png" alt="Mordisco">
    <span class="eyebrow">MORDISCO OS</span>
    <h1>Acceso de administrador</h1>
    <p class="intro">Ingresa con tu correo administrativo y contraseña.</p>

    <form id="loginForm">
      <label for="email">Correo</label>
      <input id="email" type="email" value="dpcomputers1977+admin@gmail.com" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Tu contraseña">
      <button class="primary" type="submit">Ingresar con contraseña</button>
    </form>

    <div id="message" role="status"></div>
    <button id="showRecoveryButton" class="recovery-link" type="button">¿Olvidaste tu contraseña?</button>
    <div id="recoveryPanel" class="hidden">
      <p class="recovery-note">Úsalo solo si realmente olvidaste la contraseña.</p>
      <button id="requestRecoveryButton" class="secondary recovery-button" type="button">Enviar correo de recuperación</button>
    </div>

    <a class="home" href="/">← Volver a la página principal</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (() => {
      'use strict';

      const loginForm = document.getElementById('loginForm');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const loginButton = loginForm.querySelector('button[type="submit"]');
      const messageBox = document.getElementById('message');
      const recoveryToggle = document.getElementById('showRecoveryButton');
      const recoveryPanel = document.getElementById('recoveryPanel');
      const recoveryButton = document.getElementById('requestRecoveryButton');

      function showMessage(text, type = 'info') {
        messageBox.textContent = text;
        messageBox.style.display = 'block';
        messageBox.style.background =
          type === 'error' ? '#ffe0dc' :
          type === 'success' ? '#def7e7' : '#fff4c7';
        messageBox.style.color =
          type === 'error' ? '#8b1f17' :
          type === 'success' ? '#11652d' : '#654d00';
      }

      function friendlyError(error) {
        const value = String(error?.message || error || '').toLowerCase();
        if (value.includes('invalid login credentials')) {
          return 'El correo o la contraseña no coinciden.';
        }
        if (value.includes('failed to fetch') || value.includes('network')) {
          return 'No se pudo conectar con Supabase. Revisa tu conexión e inténtalo nuevamente.';
        }
        if (value.includes('email rate limit exceeded')) {
          return 'Los correos están temporalmente limitados. Ingresa con tu contraseña.';
        }
        return error?.message || 'No se pudo completar la operación.';
      }

      function withTimeout(promise, milliseconds = 15000) {
        return Promise.race([
          promise,
          new Promise((_, reject) =>
            setTimeout(() => reject(new Error('Tiempo de conexión agotado')), milliseconds)
          )
        ]);
      }

      if (!window.supabase?.createClient) {
        showMessage('No se pudo cargar la conexión de acceso. Actualiza la página e inténtalo nuevamente.', 'error');
        loginButton.disabled = true;
        return;
      }

      const client = window.supabase.createClient(
        'https://nmmjthqflxwucpmmmrks.supabase.co',
        'sb_publishable_izCztp4wZ0MzKOHjT2KGYA_ot_3pgb0',
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            flowType: 'pkce'
          }
        }
      );

      async function openAdmin() {
        const { data: userData, error: userError } =
          await withTimeout(client.auth.getUser());

        if (userError || !userData?.user) {
          throw userError || new Error('No se pudo validar la sesión.');
        }

        const { data: adminData, error: adminError } =
          await withTimeout(
            client
              .from('admin_users')
              .select('active')
              .eq('user_id', userData.user.id)
              .eq('active', true)
              .maybeSingle()
          );

        if (adminError) throw adminError;
        if (!adminData) {
          await client.auth.signOut();
          throw new Error('Esta cuenta no tiene acceso de administrador activo.');
        }

        sessionStorage.setItem('mordisco_admin_verified', '1');
        window.location.assign('/admin?session=ok');
      }

      loginForm.addEventListener('submit', async event => {
        event.preventDefault();

        const email = emailInput.value.trim().toLowerCase();
        const password = passwordInput.value;

        if (!email || !password) {
          showMessage('Escribe el correo y la contraseña.', 'error');
          passwordInput.focus();
          return;
        }

        loginButton.disabled = true;
        loginButton.textContent = 'Ingresando…';
        showMessage('Validando tu acceso…');

        try {
          const { error } = await withTimeout(
            client.auth.signInWithPassword({ email, password })
          );

          if (error) throw error;

          showMessage('Acceso correcto. Abriendo el administrador…', 'success');
          await openAdmin();
        } catch (error) {
          console.error('Acceso Mordisco:', error);
          showMessage(friendlyError(error), 'error');
          loginButton.disabled = false;
          loginButton.textContent = 'Ingresar con contraseña';
        }
      });

      recoveryToggle.addEventListener('click', () => {
        const isHidden = recoveryPanel.classList.toggle('hidden');
        recoveryToggle.textContent = isHidden
          ? '¿Olvidaste tu contraseña?'
          : 'Ocultar recuperación';
      });

      recoveryButton.addEventListener('click', async () => {
        const email = emailInput.value.trim().toLowerCase();

        if (!email) {
          showMessage('Escribe primero tu correo administrativo.', 'error');
          emailInput.focus();
          return;
        }

        recoveryButton.disabled = true;
        recoveryButton.textContent = 'Enviando…';

        try {
          const { error } = await withTimeout(
            client.auth.resetPasswordForEmail(email, {
              redirectTo: 'https://mordiscofastfood.com/reset-password'
            })
          );

          if (error) throw error;

          showMessage('Correo enviado. Usa únicamente el mensaje más reciente.', 'success');
        } catch (error) {
          showMessage(friendlyError(error), 'error');
        } finally {
          recoveryButton.disabled = false;
          recoveryButton.textContent = 'Enviar correo de recuperación';
        }
      });

      client.auth.getSession().then(({ data }) => {
        if (data?.session?.user) {
          showMessage('Ya existe una sesión. Abriendo el administrador…', 'success');
          openAdmin().catch(error => showMessage(friendlyError(error), 'error'));
        }
      }).catch(() => {});
    })();
</script>
</body>
</html>

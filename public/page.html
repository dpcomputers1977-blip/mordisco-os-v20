<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#11100e">
  <title>Pedir | Mordisco Fast Food</title>
  <link rel="stylesheet" href="/online-v18.css?v=20.0.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="orderTopbar">
  <a href="/" class="orderBrand"><img src="/mordisco-logo.png"><span>MORDISCO <small>FAST FOOD</small></span></a>
  <a href="/" class="backStore">← Volver</a>
</header>

<main class="orderLayout">
  <section class="orderCatalog">
    <div class="orderHeading">
      <span>PEDIDO EN LÍNEA</span>
      <h1>Arma tu próximo Mordisco</h1>
      <p>Selecciona los productos y envía tu pedido. El pago se coordina al recibirlo o retirarlo.</p>
    </div>
    <div class="orderSearch"><input id="onlineSearch" placeholder="Buscar productos…"></div>
    <div id="onlineCategories" class="onlineCategories"></div>
    <div id="onlineProducts" class="onlineProducts"><p>Cargando menú…</p></div>
  </section>

  <aside class="onlineCart">
    <h2>Tu pedido</h2>
    <div id="onlineCartItems" class="onlineCartItems"><p>Tu carrito está vacío.</p></div>
    <div class="onlineTotals"><span>Total</span><b id="onlineTotal">$0,00</b></div>

    <form id="onlineOrderForm">
      <label>Nombre<input id="onlineName" required></label>
      <label>Teléfono<input id="onlinePhone" required></label>
      <label>Tipo de pedido
        <select id="onlineType">
          <option value="pickup">Retiro en el local</option>
          <option value="delivery">Delivery</option>
        </select>
      </label>
      <label id="onlineAddressWrap" class="hidden">Dirección<input id="onlineAddress"></label>
      <label>Notas<textarea id="onlineNotes" placeholder="Sin cebolla, punto de referencia…"></textarea></label>
      <button id="sendOnlineOrder" type="submit">Enviar pedido</button>
      <p class="onlineNotice">El pago se realiza al recibir o retirar el pedido.</p>
    </form>
  </aside>
</main>

<div id="onlineToast" class="onlineToast"></div>
<script src="/online-v18.js?v=20.0.0"></script>
</body>
</html>
